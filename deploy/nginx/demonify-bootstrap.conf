# Nur für die ERSTE Zertifikatsausstellung (HTTP, ACME-Challenge).
# Nach erfolgreichem certbot-Lauf durch demonify.conf ersetzen.
server {
    listen 80;
    listen [::]:80;
    server_name demonify.thedemonlord333.me;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / { return 404; }
}
