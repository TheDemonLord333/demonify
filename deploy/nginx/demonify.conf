# Demonify – Nginx-Site (Debian 12)
# Installation: /etc/nginx/sites-available/demonify.conf → Symlink in sites-enabled
# Erst NACH erfolgreicher Zertifikatsausstellung aktivieren (siehe docs/installation-debian12.md).
# Andere Sites auf dem Server bleiben unberührt (eigener server_name, eigene Datei).

upstream demonify_api {
    server 127.0.0.1:1340;
    keepalive 16;
}

# HTTP → HTTPS (ACME-Challenge bleibt per HTTP erreichbar für die Erneuerung)
server {
    listen 80;
    listen [::]:80;
    server_name demonify.thedemonlord333.me;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 liefert nginx 1.22 → HTTP/2 über "listen … http2" (ab 1.25 wäre "http2 on;" die neue Form)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demonify.thedemonlord333.me;

    ssl_certificate     /etc/letsencrypt/live/demonify.thedemonlord333.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demonify.thedemonlord333.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:demonify_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Standard: kleine Anfragen. Upload-Abschnitte haben eine eigene Location.
    client_max_body_size 2m;

    # Fehler, die Nginx selbst erzeugt (zu großer Body, Backend nicht erreichbar), für die API als JSON
    location @api_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Die Anfrage ist zu groß."}}';
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Der Demonify-Server ist vorübergehend nicht erreichbar."}}';
    }

    # ───────── API: vollständiger Pfad wird unverändert weitergegeben (/api/v1/... bleibt erhalten)
    location /api/ {
        proxy_pass http://demonify_api;          # ohne URI-Teil → Pfad wird nicht verändert
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # nur die echte Client-IP, keine fremde Kette übernehmen
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # API-Fehler (JSON) des Backends nie durch HTML-Seiten ersetzen
        proxy_intercept_errors off;
        error_page 413 = @api_too_large;
        error_page 502 503 504 = @api_unavailable;
    }

    # Upload-Abschnitte (Backend begrenzt zusätzlich auf UPLOAD_CHUNK_MB)
    location ~ ^/api/v1/admin/uploads/[0-9a-f-]+/content$ {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://demonify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        error_page 413 = @api_too_large;
        error_page 502 503 504 = @api_unavailable;
    }

    # Upload-Abschluss/Commit kann bei großen Alben länger dauern
    location = /api/v1/admin/releases/commit {
        proxy_pass http://demonify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        error_page 502 503 504 = @api_unavailable;
    }

    # ───────── Geschützte Medien: nur per X-Accel-Redirect nach Prüfung im Backend erreichbar
    location /_protected/music/ {
        internal;
        alias /srv/music/;
        types {
            audio/flac flac;
            audio/mpeg mp3;
            audio/mp4  m4a mp4;
            audio/aac  aac;
            audio/ogg  ogg oga opus;
            audio/wav  wav;
            image/jpeg jpg jpeg;
            image/png  png;
            image/webp webp;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        # Range-Anfragen (Seeking) unterstützt Nginx hier automatisch
    }
    location /_protected/cache/ {
        internal;
        alias /srv/nodeapps/demonify/data/cache/;
        types { audio/mp4 m4a; image/jpeg jpg; image/png png; image/webp webp; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ───────── Verwaltungswebseite unter /admin/
    location = /admin {
        return 301 /admin/;
    }
    location /admin/assets/ {
        alias /srv/nodeapps/demonify/current/admin-web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location /admin/ {
        alias /srv/nodeapps/demonify/current/admin-web/dist/;
        # Direkte Aufrufe von Unterseiten (z. B. /admin/upload) → index.html der Verwaltung
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ───────── Hauptadresse: reserviert für die spätere Musik-Webversion (jetzt Startseite)
    location / {
        root /srv/nodeapps/demonify/current/deploy/landing;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Musikverzeichnis niemals direkt ausliefern
    location ^~ /srv/ { return 404; }
}
